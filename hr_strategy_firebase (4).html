function sc(k){if(!k)return 0;return Math.round((k.b+k.c+k.p+k.r+k.m)/5)}
function gr(s){
  if(s>=88)return{l:'A+',t:'DRH Visionnaire',c:'#1D9E75'};
  if(s>=72)return{l:'A',t:'Excellent DRH',c:'#3B6D11'};
  if(s>=56)return{l:'B',t:'En bonne voie',c:'#185FA5'};
  if(s>=40)return{l:'C',t:'À consolider',c:'#BA7517'};
  return{l:'D',t:'Plan de redressement',c:'#A32D2D'}
}
function cl(v){return Math.max(0,Math.min(150,v))}
function ap(kpis,e){const k={...kpis};['b','c','p','r','m'].forEach((key,i)=>{k[key]=cl((k[key]||0)+(e[i]||0))});return k}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function tKey(n){return n.replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,40)}

// ── FIREBASE ───────────────────────────────────────────────────────────
let db=null;

function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=src;s.onload=resolve;s.onerror=reject;
    document.head.appendChild(s);
  });
}

async function initFirebase(){
  if(!CONFIG_OK)return false;
  try{
    await loadScript('https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js');
    firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.database();
    return true;
  }catch(e){
    console.error('Erreur Firebase:',e);
    document.getElementById('R').innerHTML=`<div style="max-width:500px;margin:3rem auto">
      <div style="background:var(--bgd);border:.5px solid var(--bdd);border-radius:var(--r2);padding:1.25rem">
        <div style="font-size:13px;font-weight:500;color:var(--txd);margin-bottom:.5rem">Impossible de contacter Firebase</div>
        <div style="font-size:13px;color:var(--txd);line-height:1.6">Vérifiez votre connexion internet et que l'URL <code>databaseURL</code> est correcte dans la config.</div>
        <button onclick="location.reload()" style="margin-top:.75rem;padding:.4rem .9rem;border:.5px solid var(--bdd);border-radius:var(--r1);background:transparent;color:var(--txd);cursor:pointer;font-size:13px">Réessayer</button>
      </div>
    </div>`;
    return false;
  }
}

async function fbSet(path,val){
  if(!db)return;
  await db.ref(path).set(val);
}
async function fbGet(path){
  if(!db)return null;
  const snap=await db.ref(path).once('value');
  return snap.val();
}
function fbListen(path,cb){
  if(!db)return ()=>{};
  const ref=db.ref(path);
  ref.on('value',snap=>cb(snap.val()));
  return ()=>ref.off('value');
}
async function fbUpdate(path,val){
  if(!db)return;
  await db.ref(path).update(val);
}
async function fbRemove(path){
  if(!db)return;
  await db.ref(path).remove();
}

// ── EVENTS HANDLER ─────────────────────────────────────────────────────
function attach(){
  const $=id=>document.getElementById(id);

  $('w-student')?.addEventListener('click',()=>{S.view='student';S.sPhase='name';renderSName()});
  $('w-teacher')?.addEventListener('click',()=>{S.view='teacher';render()});

  function renderSName(){
    document.getElementById('R').innerHTML=`<div style="max-width:460px;margin:3rem auto">
      <h2 style="font-size:20px;font-weight:500;margin-bottom:1.5rem">Votre équipe</h2>
      <div class="card">
        <label style="display:block;font-size:13px;font-weight:500;margin-bottom:.5rem">Nom de l'équipe</label>
        <input type="text" id="sn-input" placeholder="ex : Les RH de Choc, Groupe 3…" style="margin-bottom:.75rem" maxlength="35"/>
        ${S.err?`<div style="font-size:12px;color:var(--txd);margin-bottom:.5rem">${S.err}</div>`:''}
        <button id="sn-btn" class="btn pri">Rejoindre la session →</button>
      </div>
    </div>`;
    const inp=document.getElementById('sn-input');
    inp.value=S.sName;
    inp.addEventListener('input',e=>{S.sName=e.target.value.trim();S.err=''});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('sn-btn')?.click()});
    inp.focus();
    document.getElementById('sn-btn').addEventListener('click',async()=>{
      if(!S.sName){S.err='Veuillez saisir un nom.';renderSName();return}
      // Charger données existantes si l'équipe existe déjà
      const existing=await fbGet(TK+'/'+tKey(S.sName));
      if(existing){S.sKpis=existing.kpis||{...IK};S.sHistory=existing.h||[];S.sJokerUsed=existing.j||false;}
      else{S.sKpis={...IK};S.sHistory=[];S.sJokerUsed=false;}
      // Charger l'état du jeu
      const g=await fbGet(GK);if(g)S.game={evDone:{},...g};
      if(S.game.open&&S.game.turn>0){S.sChoices=Array(8).fill(-1);S.sOpen=0;S.sPhase='play';}
      else S.sPhase='wait';
      startStudentListeners();render();
    });
  }
  if(S.view==='student'&&S.sPhase==='name'){renderSName();return;}

  // Student play
  document.querySelectorAll('.acc-head').forEach(el=>{
    el.addEventListener('click',()=>{const i=parseInt(el.dataset.ai);S.sOpen=S.sOpen===i?-1:i;render()});
  });
  document.querySelectorAll('.choice').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const ti=parseInt(btn.dataset.ti);const ci=parseInt(btn.dataset.ci);
      const ch=SC[S.game.turn-1][ti].ch[ci];
      S.sChoices[ti]=ci;S.sKpis=ap(S.sKpis,ch.e);
      S.sOpen=ti<7?ti+1:-1;render();
    });
  });
  $('joker-open')?.addEventListener('click',()=>{S.sJokerMode=true;render()});
  $('joker-cancel')?.addEventListener('click',()=>{S.sJokerMode=false;render()});
  document.querySelectorAll('[data-jkpi]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const kpi=btn.dataset.jkpi;S.sKpis[kpi]=cl(S.sKpis[kpi]+15);
      S.sJokerUsed=true;S.sJokerMode=false;
      S.sHistory.push({turn:S.game.turn,joker:true,kpisAfter:{...S.sKpis}});
      await saveTeam();render();
    });
  });
  $('submit-play')?.addEventListener('click',async()=>{
    const btn=$('submit-play');btn.disabled=true;btn.textContent='Envoi…';
    S.sHistory.push({turn:S.game.turn,choices:[...S.sChoices],kpisAfter:{...S.sKpis}});
    await saveTeam();S.sPhase='done';render();
  });
  $('s-ready-next')?.addEventListener('click',()=>{S.sPhase='wait';render()});

  // Teacher login
  const ti=$('tp-input');
  ti?.addEventListener('input',e=>S.tPass=e.target.value);
  ti?.addEventListener('keydown',e=>{if(e.key==='Enter')$('tp-btn')?.click()});
  $('tp-btn')?.addEventListener('click',async()=>{
    if(S.tPass===PASS){
      S.tPhase='dash';
      const g=await fbGet(GK);if(g)S.game={evDone:{},...g};
      await loadAllTeams();
      startTeacherListeners();render();
    }else{S.tErr='Mot de passe incorrect.';render();}
  });
  $('tp-back')?.addEventListener('click',()=>{S.view='welcome';render()});
  $('t-back')?.addEventListener('click',()=>{unsub();S.view='welcome';render()});
  $('t-refresh')?.addEventListener('click',async()=>{await loadAllTeams();render()});
  $('t-open')?.addEventListener('click',async()=>{
    await saveGame({turn:S.game.turn+1,open:true});render();
  });
  $('t-close')?.addEventListener('click',async()=>{
    await saveGame({open:false});await loadAllTeams();render();
  });
  $('t-reveal')?.addEventListener('click',()=>{S.tReveal=0;render()});
  $('t-debrief')?.addEventListener('click',()=>{S.tShowDebrief=true;render()});
  $('t-reset-all')?.addEventListener('click',async()=>{
    if(confirm('Effacer toutes les équipes et recommencer ? Cette action est irréversible.')){
      await fbRemove(TK);await fbRemove(GK);
      S.game={turn:0,open:false,evDone:{}};S.allTeams=[];render();
    }
  });

  async function triggerEvent(evId){
    await loadAllTeams();
    const ev=EVENTS.find(e=>e.id===evId);if(!ev)return;
    const updated=ev.fn(S.allTeams);
    for(const t of updated)await fbSet(TK+'/'+tKey(t.n),t);
    await saveGame({evDone:{...(S.game.evDone||{}),[evId]:true}});
    await loadAllTeams();render();
  }
  $('t-ev1')?.addEventListener('click',async()=>{const b=$('t-ev1');b.disabled=true;b.textContent='Application…';await triggerEvent('ev_crise');render();});
  $('t-ev2')?.addEventListener('click',async()=>{const b=$('t-ev2');b.disabled=true;b.textContent='Application…';await triggerEvent('ev_rebond');render();});

  $('rev-next')?.addEventListener('click',()=>{S.tReveal=Math.min(S.tReveal+1,S.allTeams.length-1);render()});
  $('rev-done')?.addEventListener('click',()=>{S.tReveal=-1;render()});
  $('rev-close')?.addEventListener('click',()=>{S.tReveal=-1;render()});
  $('debrief-close')?.addEventListener('click',()=>{S.tShowDebrief=false;render()});
}

// ── FIREBASE LISTENERS (temps réel) ───────────────────────────────────
function startStudentListeners(){
  unsub();
  // Écoute les changements d'état du jeu en temps réel
  const u1=fbListen(GK,async(data)=>{
    if(!data)return;
    const prevOpen=S.game.open;const prevTurn=S.game.turn;
    S.game={evDone:{},...data};
    if(S.sPhase==='wait'&&S.game.open&&S.game.turn>0&&S.game.turn>prevTurn){
      S.sChoices=Array(8).fill(-1);S.sOpen=0;S.sPhase='play';render();
    } else if(S.sPhase==='done'&&prevOpen&&!S.game.open){
      // Tour clôturé — recharger les données et afficher le récap
      const saved=await fbGet(TK+'/'+tKey(S.sName));
      if(saved){S.sKpis=saved.kpis||S.sKpis;S.sHistory=saved.h||S.sHistory;S.sJokerUsed=saved.j||S.sJokerUsed;}
      await loadAllTeams();S.sPhase='recap';render();
    }
  });
  S.unsubs.push(u1);
}

function startTeacherListeners(){
  unsub();
  // Écoute les nouvelles équipes et soumissions en temps réel
  const u1=fbListen(TK,async(data)=>{
    if(!data){S.allTeams=[];render();return;}
    S.allTeams=Object.values(data).filter(t=>t&&t.n).sort((a,b)=>sc(b.kpis)-sc(a.kpis));
    if(S.view==='teacher'&&S.tPhase==='dash'&&S.tReveal<0&&!S.tShowDebrief)render();
  });
  const u2=fbListen(GK,(data)=>{
    if(!data)return;
    S.game={evDone:{},...data};
  });
  S.unsubs.push(u1,u2);
}

// ── INIT ───────────────────────────────────────────────────────────────
(async()=>{
  try{
    // Toujours afficher la page en premier
    render();
    if(!CONFIG_OK)return;
    // Charger Firebase
    const ok=await initFirebase();
    if(!ok)return;
    // Charger l'état du jeu
    try{
      const g=await fbGet(GK);
      if(g)S.game={evDone:{},...g};
    }catch(e){console.warn('Impossible de charger l\'état du jeu:',e);}
    render();
  }catch(e){
    console.error('Erreur init:',e);
    document.getElementById('R').innerHTML=`<div style="max-width:500px;margin:3rem auto;font-family:system-ui,sans-serif">
      <div style="background:#fcebeb;border:1px solid rgba(163,45,45,.4);border-radius:12px;padding:1.25rem">
        <div style="font-size:14px;font-weight:500;color:#791f1f;margin-bottom:.5rem">Erreur au démarrage</div>
        <div style="font-size:13px;color:#791f1f;margin-bottom:.75rem;line-height:1.6">${e.message||'Erreur inconnue'}</div>
        <div style="font-size:12px;color:#791f1f;margin-bottom:.75rem;line-height:1.6">Si vous voyez une erreur Firebase, vérifiez que :<br>
        1. La Realtime Database est activée dans votre projet Firebase<br>
        2. L'URL <code>databaseURL</code> est correcte dans la config<br>
        3. Les règles de la base sont en mode "test" (lecture/écriture autorisées)</div>
        <button onclick="location.reload()" style="padding:.4rem .9rem;border:1px solid rgba(163,45,45,.4);border-radius:8px;background:transparent;color:#791f1f;cursor:pointer;font-size:13px">↻ Réessayer</button>
      </div>
    </div>`;
  }
})();
</script>
